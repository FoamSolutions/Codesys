<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Foam Solutions QC</title><style>:root{--b:#8a5a3b;--d:#5c3827;--c:#f8f3ee;--l:#ccb39d;--r:#a3261d;--g:#23783a}*{box-sizing:border-box}body{margin:0;background:#f2efec;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;color:#222}main{max-width:980px;margin:auto;padding:12px}header,section{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0001}header{position:sticky;top:0;z-index:5}h1{color:var(--d);font-size:clamp(24px,5vw,36px);margin:8px 0}.brand{font-size:28px;font-weight:900;color:var(--b)}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:12px 15px;background:var(--b);color:#fff;font-weight:800;font-size:16px}button.alt{background:#fff;color:var(--d);border:2px solid var(--b)}button.red{background:var(--r)}.title{background:var(--b);color:#fff;border-radius:10px;padding:10px 12px;font-weight:900;font-size:19px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-weight:800;margin-bottom:5px}input,textarea{width:100%;font-size:18px;padding:12px;border:1px solid var(--l);border-radius:10px}input[readonly]{background:var(--c);font-weight:800}textarea{min-height:100px}.sample{background:var(--c);padding:14px;border-radius:14px;margin:14px 0}.photo{background:#fff;border:2px dashed var(--b);border-radius:12px;padding:12px}.photo input[type=file]{display:block;width:100%;margin:8px 0;padding:12px;border:2px solid var(--b);background:#fff}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.thumb{position:relative;background:#111;border-radius:10px;overflow:hidden}.thumb img{width:100%;height:220px;object-fit:contain;display:block}.thumb button{position:absolute;top:6px;right:6px;padding:7px 9px;font-size:13px;background:var(--r)}.result{padding:11px;border-radius:10px;text-align:center;font-weight:900}.pass{background:#e7f5ea;color:var(--g)}.fail{background:#fde8e5;color:#b42318}.small{color:#666;font-size:13px}@media(max-width:760px){.grid,.grid3,.gallery{grid-template-columns:1fr}}@media print{button,input[type=file]{display:none!important}body{background:#fff}header{position:static}.thumb button{display:none}}</style></head><body><main><header><div class="brand">⚙ FS · FOAM SOLUTIONS</div><h1>Spray Foam Quality Control Report</h1><p>Foam Solutions · (231) 333-4221 · Sales@FoamSolutions.org · FoamSolutions.org</p><div class="actions"><button type="button" onclick="saveForm()">Save</button><button type="button" class="alt" onclick="window.print()">Export PDF</button><button type="button" class="red" onclick="clearForm()">Clear Form</button></div></header><form id="f"><section><div class="title">1. Job Information</div><div class="grid"><div><label>Spray Date</label><input name="spray_date" type="date" value="2026-07-28"></div><div><label>Job #</label><input name="job_number" value="0100"></div><div><label>Customer</label><input name="customer" value="Bazzett"></div><div><label>Technician</label><input name="technician" value="Kenny"></div></div><div style="margin-top:12px"><label>Address</label><input name="address" value="3566 Village Circle Dr, Traverse City, MI 49686"></div><div style="margin-top:12px"><label>Foam System</label><input name="foam" value="Central Urethane Express Seal 200 - 2 lb Closed Cell"></div></section><section><div class="title">2. Production Calculator</div><div class="grid3"><div><label>Expected BF</label><input id="expected" type="number" step=".1" oninput="calc()"></div><div><label>Installed BF</label><input id="installed" type="number" step=".1" value="171" oninput="calc()"></div><div><label>Waste BF</label><input id="waste" type="number" step=".1" value="150" oninput="calc()"></div><div><label>Total Used BF</label><input id="total" readonly></div><div><label>Useful Yield %</label><input id="yield" readonly></div><div><label>Waste %</label><input id="wastepct" readonly></div></div><button type="button" class="alt" style="margin-top:12px" onclick="calc()">Calculate</button></section><section><div class="title">3. Density Samples</div><div class="grid"><div><label>Minimum Density</label><input id="min" type="number" step=".01" value="1.80" oninput="calc()"></div><div><label>Maximum Density</label><input id="max" type="number" step=".01" value="2.20" oninput="calc()"></div></div><p class="small">Density = grams ÷ displaced mL × 62.42796</p><div id="samples"></div><div class="grid"><div><label>Average Density</label><input id="avg" readonly></div><div><label>Overall Result</label><div id="overall" class="result"></div></div></div></section><section><div class="title">4. Before and After Photos</div><div class="grid" id="jobphotos"></div><div style="margin-top:12px"><label>Photo Notes</label><textarea name="photo_notes"></textarea></div></section><section><div class="title">5. Process Notes</div><textarea name="process_notes">The spray gun appeared to pulse material. At roughly 1.0 GPM, the nucleation air did not produce a fine, consistent stream. During the first half of the spray, the line and tank heaters were shut off after a restart. During the second trip to the attic, the machine was started momentarily with nucleation/purge air off.</textarea></section></form></main><script>const defs=[{w:3,s:305,f:375},{w:4,s:305,f:415},{w:3,s:305,f:410}],photoStore={};function photo(id,title){return `<div class="photo"><h3>${title}</h3><label>Add photos</label><input id="${id}_input" type="file" accept="image/*" multiple onchange="addPhotos(this,'${id}')"><div id="${id}_gallery" class="gallery"></div><button type="button" class="red" style="margin-top:10px" onclick="clearPhotos('${id}')">Remove All Photos</button></div>`}document.getElementById('samples').innerHTML=defs.map((d,i)=>{let n=i+1;return `<div class="sample"><h2>Sample ${n}</h2><div class="grid3"><div><label>Weight (g)</label><input id="w${n}" type="number" step=".01" value="${d.w}" oninput="calc()"></div><div><label>Starting Water (mL)</label><input id="s${n}" type="number" step=".1" value="${d.s}" oninput="calc()"></div><div><label>Finished Water (mL)</label><input id="f${n}" type="number" step=".1" value="${d.f}" oninput="calc()"></div><div><label>Displaced Volume</label><input id="v${n}" readonly></div><div><label>Density (lb/ft³)</label><input id="d${n}" readonly></div><div><label>Result</label><div id="r${n}" class="result"></div></div></div><div class="grid" style="margin-top:12px">${photo('p'+n,'Sample '+n+' Photos')}<div><label>Sample Notes</label><textarea></textarea></div></div></div>`}).join('');document.getElementById('jobphotos').innerHTML=photo('before','Before Photos')+photo('after','After Photos');function num(id){return parseFloat(document.getElementById(id).value)||0}function calc(){let ins=num('installed'),wa=num('waste'),t=ins+wa;document.getElementById('total').value=t?t.toFixed(1):'';document.getElementById('yield').value=t?(ins/t*100).toFixed(2):'';document.getElementById('wastepct').value=t?(wa/t*100).toFixed(2):'';let mn=num('min'),mx=num('max'),sum=0,c=0;for(let i=1;i<=3;i++){let w=num('w'+i),s=num('s'+i),f=num('f'+i),v=f-s,d=v>0?w/v*62.42796:0;document.getElementById('v'+i).value=v>0?v.toFixed(1):'';document.getElementById('d'+i).value=d?d.toFixed(2):'';let r=document.getElementById('r'+i),ok=d&&d>=mn&&d<=mx;r.textContent=d?(ok?'PASS':'FAIL'):'';r.className='result '+(d?(ok?'pass':'fail'):'');if(d){sum+=d;c++}}let a=c?sum/c:0;document.getElementById('avg').value=a?a.toFixed(2):'';let o=document.getElementById('overall'),ok=a&&a>=mn&&a<=mx;o.textContent=a?(ok?'PASS':'FAIL'):'';o.className='result '+(a?(ok?'pass':'fail'):'')}function addPhotos(input,id){const files=[...(input.files||[])];if(!files.length)return;photoStore[id]=photoStore[id]||[];files.forEach(file=>{const r=new FileReader();r.onload=e=>{photoStore[id].push(e.target.result);savePhotos(id);renderPhotos(id)};r.readAsDataURL(file)});input.value=''}function renderPhotos(id){const g=document.getElementById(id+'_gallery'),arr=photoStore[id]||[];g.innerHTML=arr.map((src,i)=>`<div class="thumb"><img src="${src}" alt="Photo ${i+1}"><button type="button" onclick="removeOne('${id}',${i})">Remove</button></div>`).join('')}function removeOne(id,i){photoStore[id].splice(i,1);savePhotos(id);renderPhotos(id)}function clearPhotos(id){photoStore[id]=[];localStorage.removeItem('imgs_'+id);renderPhotos(id)}function savePhotos(id){try{localStorage.setItem('imgs_'+id,JSON.stringify(photoStore[id]||[]))}catch(e){alert('These photos are too large to save in the browser. They will remain until the page is closed.')}}function saveForm(){let d={};document.querySelectorAll('input:not([type=file]),textarea').forEach(x=>d[x.name||x.id]=x.value);localStorage.setItem('foam_form',JSON.stringify(d));alert('Saved on this device.')}function clearForm(){if(!confirm('Clear all fields and photos?'))return;localStorage.removeItem('foam_form');['p1','p2','p3','before','after'].forEach(clearPhotos);document.getElementById('f').reset();calc()}window.addEventListener('load',()=>{calc();['p1','p2','p3','before','after'].forEach(id=>{try{photoStore[id]=JSON.parse(localStorage.getItem('imgs_'+id)||'[]')}catch(e){photoStore[id]=[]}renderPhotos(id)})});</script></body></html>
